name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Test, package and publish
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Run test suite
        run: make test

      - name: Check the tag matches the version
        run: |
          set -euo pipefail
          version=$(sed -n "s/^readonly VERSION='\(.*\)'/\1/p" bin/clamshell)
          if [[ "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} is not v${version}"
            exit 1
          fi

      - name: Build the installer
        run: make pkg

      - name: Write release notes
        run: |
          set -euo pipefail
          version=$(sed -n "s/^readonly VERSION='\(.*\)'/\1/p" bin/clamshell)
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md > build/release-notes.md
          test -s build/release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n "s/^readonly VERSION='\(.*\)'/\1/p" bin/clamshell)
          gh release create "$GITHUB_REF_NAME" "build/Clamshell-${version}.pkg" \
            --title "Clamshell ${version}" \
            --notes-file build/release-notes.md
